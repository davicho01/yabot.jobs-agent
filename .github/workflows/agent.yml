name: Logo agent

# Designs logos for companies in yabot.jobs-backend's
# migrations/data/companies_missing_logos_with_domain.csv, uploads them to S3,
# and opens a PR on the backend with the updated CSV and an Alembic upgrade
# that points each company at its logo. One batch at a time: a run does
# nothing while a previous logo PR is still open. See GOAL.md.

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Companies per run"
        required: false
        default: "10"
  # Uncomment to run on a schedule (counts against your Claude subscription limits)
  # schedule:
  #   - cron: "0 9 * * 1-5"

permissions:
  contents: read
  id-token: write # OIDC for AWS (and the Claude action)

concurrency:
  group: logo-agent
  cancel-in-progress: false

env:
  BACKEND_REPO: davicho01/yabot.jobs-backend
  LOGO_BUCKET: yabot.jobs-frontend
  AWS_REGION: us-east-1

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Skip while a logo PR is open
        id: guard
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          open=$(gh pr list --repo "$BACKEND_REPO" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("agent/logos-"))] | length')
          echo "open=$open"
          if [ "$open" != "0" ]; then
            echo "A logo PR is still open on $BACKEND_REPO; merge or close it first." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          repository: ${{ env.BACKEND_REPO }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 fonts-dejavu-core
          pip install -q -r requirements.txt
          git -C backend config user.name "yabot logo agent"
          git -C backend config user.email "logo-agent@users.noreply.github.com"

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow GOAL.md exactly. Batch size for this run: ${{ inputs.batch_size || '10' }}.
            The backend repository is checked out at ./backend (GitHub: ${{ env.BACKEND_REPO }}).
            Run id for the branch name: ${{ github.run_id }}.
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python tools/logo_pipeline.py:*),Bash(git -C backend:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(python -m py_compile:*),Bash(mkdir:*),Bash(ls:*)"
